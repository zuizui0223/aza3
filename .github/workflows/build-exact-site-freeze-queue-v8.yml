name: Build exact-site freeze queue v8

on:
  pull_request:
    paths:
      - "analysis/build_exact_site_freeze_queue_v8.py"
      - "data/planning/chapter3_holefill_priority1_sample_sectors_v7.csv"
      - "data/planning/chapter3_holefill_priority2_sample_sectors_v7.csv"
      - "data/planning/chapter3_holefill_priority3_sample_sectors_v7.csv"
      - "data/planning/chapter3_holefill_priority4_sample_sectors_v7.csv"
      - "data/planning/chapter3_holefill_priority5_sample_sectors_v7.csv"
      - "data/planning/chapter3_holefill_priority6_sample_sectors_v7.csv"
      - "data/planning/chapter3_holefill_priority7_sample_sectors_v7.csv"
      - ".github/workflows/build-exact-site-freeze-queue-v8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build queue
        run: python analysis/build_exact_site_freeze_queue_v8.py
      - name: Audit queue shape
        run: |
          python - <<'PY'
          import csv
          p='data/planning/chapter3_exact_site_freeze_queue_v8.csv'
          with open(p, encoding='utf-8', newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==229
          assert sum(r['required_for_tree']=='true' for r in rows)==228
          assert all(r['freeze_status']=='NOT_FROZEN' for r in rows)
          assert all('latitude' not in r and 'longitude' not in r for r in rows)
          print('queue_shape_valid=true')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter3-exact-site-freeze-queue-v8
          path: data/planning/chapter3_exact_site_freeze_queue_v8.csv
          retention-days: 14
