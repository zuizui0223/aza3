name: Run R1B0 focal public smoke

on:
  pull_request:
    paths:
      - ".github/workflows/run-r1b0-public-smoke-v1.yml"
      - "docs/R1B0_EXECUTION_RUNBOOK_V1.md"
      - "data/contracts/aza3_reference_transfer_public_preflight_v1.json"
      - "data/evidence/comp1061_public_target_audit_v1.json"
  workflow_dispatch:

concurrency:
  group: run-r1b0-public-smoke-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up R1B0 environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          activate-environment: r1b0
          miniforge-version: latest
          channels: conda-forge,bioconda
          channel-priority: strict
          auto-activate-base: false

      - name: Install HybPiper and SRA tools
        shell: bash -el {0}
        run: |
          conda install -y hybpiper=2.3.4 sra-tools
          hybpiper --version
          fasterq-dump --version
          bwa 2>&1 | head -n 3 || true

      - name: Recover and audit original Compositae1061 target
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p r1b0_smoke
          curl -L --fail --retry 4 \
            https://raw.githubusercontent.com/carol-siniscalchi/Comp1061-Angio353/main/comp1061_hybpiper_reference.fasta \
            -o r1b0_smoke/comp1061_hybpiper_reference.fasta
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("r1b0_smoke/comp1061_hybpiper_reference.fasta")
          headers=[x[1:] for x in p.read_text().splitlines() if x.startswith(">")]
          loci=sorted({h.split("-",1)[1] for h in headers})
          prefixes=sorted({h.split("-",1)[0] for h in headers})
          assert len(headers)==2597, len(headers)
          assert len(loci)==1061, len(loci)
          assert prefixes==["lett","saff","sunf"], prefixes
          Path("r1b0_smoke/target_audit_runtime.json").write_text(json.dumps({
              "sequence_records":len(headers),
              "distinct_loci":len(loci),
              "prefixes":prefixes,
          },indent=2)+"\n")
          PY

      - name: Download focal public SRA object
        shell: bash -el {0}
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            https://sra-pub-run-odp.s3.amazonaws.com/sra/SRR30887308/SRR30887308 \
            -o r1b0_smoke/SRR30887308.sra
          echo "4ab8540f122074512893acdf25ce4e21  r1b0_smoke/SRR30887308.sra" | md5sum -c -
          test "$(stat -c%s r1b0_smoke/SRR30887308.sra)" -eq 325003441

      - name: Convert SRA to paired FASTQ
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p r1b0_smoke/reads
          fasterq-dump r1b0_smoke/SRR30887308.sra \
            --split-files \
            -e 4 \
            -O r1b0_smoke/reads
          test -s r1b0_smoke/reads/SRR30887308_1.fastq
          test -s r1b0_smoke/reads/SRR30887308_2.fastq
          python - <<'PY'
          from pathlib import Path
          import json
          out={}
          for mate in (1,2):
              p=Path(f"r1b0_smoke/reads/SRR30887308_{mate}.fastq")
              n=sum(1 for _ in p.open())//4
              out[f"mate{mate}_reads"]=n
              out[f"mate{mate}_bytes"]=p.stat().st_size
          assert out["mate1_reads"]==out["mate2_reads"]
          Path("r1b0_smoke/fastq_receipt.json").write_text(json.dumps(out,indent=2)+"\n")
          PY

      - name: Run focal HybPiper smoke against original target
        shell: bash -el {0}
        run: |
          set -euo pipefail
          cd r1b0_smoke
          hybpiper assemble \
            -t_dna comp1061_hybpiper_reference.fasta \
            -r reads/SRR30887308_1.fastq reads/SRR30887308_2.fastq \
            --bwa \
            --prefix Cirsium_sieboldii_366 \
            --cpu 4 \
            > hybpiper_stdout.log 2> hybpiper_stderr.log

      - name: Summarize locus recovery
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("r1b0_smoke")
          sample=root/"Cirsium_sieboldii_366"
          genes_file=sample/"genes_with_seqs.txt"
          paralog_file=sample/"genes_with_paralog_warnings.txt"
          if genes_file.exists():
              recovered=[x.strip() for x in genes_file.read_text().splitlines() if x.strip()]
          else:
              recovered=sorted({p.stem for p in sample.rglob("*.FNA")})
          paralogs=[]
          if paralog_file.exists():
              paralogs=[x.strip() for x in paralog_file.read_text().splitlines() if x.strip()]
          receipt={
              "status":"ok",
              "run":"SRR30887308",
              "taxon":"Cirsium sieboldii",
              "sample_prefix":"Cirsium_sieboldii_366",
              "target_version":"ORIGINAL_COMP1061",
              "target_locus_universe":1061,
              "loci_recovered":len(set(recovered)),
              "loci_recovered_fraction":len(set(recovered))/1061,
              "paralog_warning_loci":len(set(paralogs)),
              "genes_with_seqs_file_found":genes_file.exists(),
              "paralog_warning_file_found":paralog_file.exists(),
          }
          Path("r1b0_smoke/focal_smoke_receipt.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,indent=2))
          assert receipt["loci_recovered"] > 0
          PY

      - name: Upload bounded smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: r1b0-focal-public-smoke-${{ github.run_id }}
          path: |
            r1b0_smoke/target_audit_runtime.json
            r1b0_smoke/fastq_receipt.json
            r1b0_smoke/focal_smoke_receipt.json
            r1b0_smoke/hybpiper_stdout.log
            r1b0_smoke/hybpiper_stderr.log
          retention-days: 30
