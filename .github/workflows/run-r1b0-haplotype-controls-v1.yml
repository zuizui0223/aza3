name: Run R1B-0 haplotype controls

on:
  pull_request:
    paths:
      - ".github/workflows/run-r1b0-haplotype-controls-v1.yml"
      - "analysis/compare_r1b0_haplotype_localizations_v1.py"
      - "analysis/summarize_r1b0_reference_localization_v1.py"
      - "data/evidence/r1b0_genome_reference_byte_contract_v1.json"
  workflow_dispatch:

concurrency:
  group: run-r1b0-haplotype-controls-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  haplotype-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frozen EAzami source for CNIPG positive control
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/EAzami
          ref: f406c32ac6d4a8da49777d7973a92f48146bd6df
          path: eazami
          persist-credentials: false

      - name: Create minimal mapping environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: r1b0-hap-control
          init-shell: bash
          cache-environment: true
          create-args: >-
            python=3.12
            minimap2
            biopython
            -c conda-forge
            -c bioconda

      - name: Recover frozen Stage2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prior
          gh run download 37282907706             --repo "${GITHUB_REPOSITORY}"             --name r1b0-stage2-primary-references-37282907706             --dir prior
          echo "1998a227a61184a99a85ea56e76c472f24c84e6f86a4fad3605917a4b9f177b  prior/focal_241.fasta" | sha256sum -c -
          test -s prior/localization/focal__heterophyllum_hap1.tsv
          test -s prior/localization/focal__dissectum_hap1.tsv

      - name: Materialize CNIPG 180-locus positive control FASTA
        run: |
          set -euo pipefail
          python eazami/analysis/materialize_frozen_public_candidate_locus_pack.py             --candidate CNIPG             --output cnipg_pack
          python - <<'PY'
          from pathlib import Path
          from Bio import SeqIO
          out=Path("cnipg_180.fasta")
          with out.open("w") as fh:
              for p in sorted(Path("cnipg_pack/loci").glob("*.fasta")):
                  recs=list(SeqIO.parse(str(p),"fasta"))
                  if len(recs)!=1:
                      raise SystemExit(f"{p}: expected one record")
                  seq=str(recs[0].seq).upper()
                  fh.write(f">{p.stem}|CNIPG\n")
                  for i in range(0,len(seq),80):
                      fh.write(seq[i:i+80]+"\n")
          assert sum(1 for x in out.read_text().splitlines() if x.startswith(">"))==180
          PY

      - name: Download and map C. heterophyllum hap2
        run: |
          set -euo pipefail
          mkdir -p refs hap2
          curl -L --fail --retry 8 --retry-all-errors             https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/965/225/975/GCA_965225975.1_daCirHete1.hap2.1/GCA_965225975.1_daCirHete1.hap2.1_genomic.fna.gz             -o refs/heterophyllum_hap2.fna.gz
          echo "f2c131de0c37d88b8ddfb24ba15ca33b  refs/heterophyllum_hap2.fna.gz" | md5sum -c -
          gunzip -c refs/heterophyllum_hap2.fna.gz > refs/heterophyllum_hap2.fna
          echo "12fb5d97949287ad43daacdc42c30f9b  refs/heterophyllum_hap2.fna" | md5sum -c -
          minimap2 -x splice:hq -G 500k --secondary=yes -N 10 -t 4             refs/heterophyllum_hap2.fna prior/focal_241.fasta             > hap2/focal__heterophyllum_hap2.paf
          minimap2 -x splice:hq -G 500k --secondary=yes -N 10 -t 4             refs/heterophyllum_hap2.fna cnipg_180.fasta             > hap2/cnipg__heterophyllum_hap2.paf
          python analysis/summarize_r1b0_reference_localization_v1.py             --paf hap2/focal__heterophyllum_hap2.paf             --reference-id heterophyllum_hap2             --output-tsv hap2/focal__heterophyllum_hap2.tsv             --output-json hap2/focal__heterophyllum_hap2.json
          python analysis/summarize_r1b0_reference_localization_v1.py             --paf hap2/cnipg__heterophyllum_hap2.paf             --reference-id heterophyllum_hap2             --output-tsv hap2/cnipg__heterophyllum_hap2.tsv             --output-json hap2/cnipg__heterophyllum_hap2.json
          rm -f refs/heterophyllum_hap2.fna refs/heterophyllum_hap2.fna.gz

      - name: Download and map C. dissectum hap2
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-all-errors             https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/965/276/745/GCA_965276745.1_daCirDiss1.hap2.1/GCA_965276745.1_daCirDiss1.hap2.1_genomic.fna.gz             -o refs/dissectum_hap2.fna.gz
          echo "eb3bb9a68dc278ec9bd5c587d60a82ea  refs/dissectum_hap2.fna.gz" | md5sum -c -
          gunzip -c refs/dissectum_hap2.fna.gz > refs/dissectum_hap2.fna
          echo "9436bc6f958406d7642292c9f0258661  refs/dissectum_hap2.fna" | md5sum -c -
          minimap2 -x splice:hq -G 500k --secondary=yes -N 10 -t 4             refs/dissectum_hap2.fna prior/focal_241.fasta             > hap2/focal__dissectum_hap2.paf
          minimap2 -x splice:hq -G 500k --secondary=yes -N 10 -t 4             refs/dissectum_hap2.fna cnipg_180.fasta             > hap2/cnipg__dissectum_hap2.paf
          python analysis/summarize_r1b0_reference_localization_v1.py             --paf hap2/focal__dissectum_hap2.paf             --reference-id dissectum_hap2             --output-tsv hap2/focal__dissectum_hap2.tsv             --output-json hap2/focal__dissectum_hap2.json
          python analysis/summarize_r1b0_reference_localization_v1.py             --paf hap2/cnipg__dissectum_hap2.paf             --reference-id dissectum_hap2             --output-tsv hap2/cnipg__dissectum_hap2.tsv             --output-json hap2/cnipg__dissectum_hap2.json
          rm -f refs/dissectum_hap2.fna refs/dissectum_hap2.fna.gz

      - name: Compare hap1 vs hap2 noise
        run: |
          set -euo pipefail
          python analysis/compare_r1b0_haplotype_localizations_v1.py             --hap1 prior/localization/focal__heterophyllum_hap1.tsv             --hap2 hap2/focal__heterophyllum_hap2.tsv             --taxon Cirsium_heterophyllum             --query-set-id C_SIEBOLDII_MOREYRA_COMPATIBILITY_241             --output-json focal_heterophyllum_hap_control.json             --output-tsv focal_heterophyllum_hap_control.tsv
          python analysis/compare_r1b0_haplotype_localizations_v1.py             --hap1 prior/localization/focal__dissectum_hap1.tsv             --hap2 hap2/focal__dissectum_hap2.tsv             --taxon Cirsium_dissectum             --query-set-id C_SIEBOLDII_MOREYRA_COMPATIBILITY_241             --output-json focal_dissectum_hap_control.json             --output-tsv focal_dissectum_hap_control.tsv
          python analysis/compare_r1b0_haplotype_localizations_v1.py             --hap1 prior/localization/cnipg__heterophyllum_hap1.tsv             --hap2 hap2/cnipg__heterophyllum_hap2.tsv             --taxon Cirsium_heterophyllum             --query-set-id C_NIPPONICUM_GENOME_DERIVED_180             --output-json cnipg_heterophyllum_hap_control.json             --output-tsv cnipg_heterophyllum_hap_control.tsv
          python analysis/compare_r1b0_haplotype_localizations_v1.py             --hap1 prior/localization/cnipg__dissectum_hap1.tsv             --hap2 hap2/cnipg__dissectum_hap2.tsv             --taxon Cirsium_dissectum             --query-set-id C_NIPPONICUM_GENOME_DERIVED_180             --output-json cnipg_dissectum_hap_control.json             --output-tsv cnipg_dissectum_hap_control.tsv

      - name: Build haplotype-control decision receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          files=[
            "focal_heterophyllum_hap_control.json",
            "focal_dissectum_hap_control.json",
            "cnipg_heterophyllum_hap_control.json",
            "cnipg_dissectum_hap_control.json",
          ]
          d={f.replace(".json",""):json.load(open(f)) for f in files}
          classes=[x["classification"] for x in d.values()]
          if all(x=="LOW_HAPLOTYPE_REFERENCE_NOISE" for x in classes):
              decision="HAPLOTYPE_CONTROL_GREEN__PROCEED_TO_OWN_WGS_PILOT"
          elif "HIGH_HAPLOTYPE_REFERENCE_NOISE" in classes:
              decision="HAPLOTYPE_CONTROL_RED__FOCAL_REFERENCE_PRIORITY_INCREASED"
          else:
              decision="HAPLOTYPE_CONTROL_AMBER__KEEP_REFERENCE_SENSITIVITY_IN_WGS_PILOT"
          out={
              "result_version":"r1b0_haplotype_control_decision_v1",
              "source_stage2_run":37282907706,
              "mapping_preset":"minimap2 -x splice:hq -G 500k --secondary=yes -N 10",
              "controls":d,
              "decision":decision,
              "claim_boundary":"Reference-haplotype noise calibration only. No local ancestry, recombination, haplotype-age, structural-variant, genomic-modularity or genotype-phenotype claim is authorized."
          }
          open("r1b0_haplotype_control_decision_v1.json","w").write(json.dumps(out,indent=2)+"\n")
          print(json.dumps({
              "decision":decision,
              "classifications":classes,
              "focal_heterophyllum_agreement":d["focal_heterophyllum_hap_control"]["unique_status_agreement_fraction"],
              "focal_dissectum_agreement":d["focal_dissectum_hap_control"]["unique_status_agreement_fraction"],
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r1b0-haplotype-controls-${{ github.run_id }}
          path: |
            *_hap_control.json
            *_hap_control.tsv
            r1b0_haplotype_control_decision_v1.json
            hap2/*.json
            hap2/*.tsv
          if-no-files-found: error
          retention-days: 30
