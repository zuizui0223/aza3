name: Validate aza3 Nature-scale master plan

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/AZA3_NATURE_SCALE_MASTER_PLAN_V1.md"
      - "data/planning/aza3_nature_sampling_priorities_v2.csv"
      - "data/planning/eazami_to_aza3_hypothesis_bridge_v1.csv"
      - "analysis/validate_aza3_nature_master_plan_v1.py"
      - ".github/workflows/validate-aza3-nature-master-plan-v1.yml"
  workflow_dispatch:

concurrency:
  group: validate-aza3-nature-master-plan-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile analysis/validate_aza3_nature_master_plan_v1.py
          python analysis/validate_aza3_nature_master_plan_v1.py
