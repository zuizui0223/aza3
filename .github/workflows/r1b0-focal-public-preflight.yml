name: R1B0 focal public-data preflight

on:
  pull_request:
    paths:
      - ".github/workflows/r1b0-focal-public-preflight.yml"
      - "analysis/summarize_r1b0_hybpiper_v1.py"
      - "data/evidence/comp1061_public_target_audit_v1.json"
  workflow_dispatch:

concurrency:
  group: r1b0-focal-public-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focal-original-target:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up bioinformatics environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: r1b0
          cache-environment: true
          create-args: >-
            python=3.12
            hybpiper=2.3.4
            sra-tools
            pigz
            -c conda-forge
            -c bioconda

      - name: Recover and audit original Compositae1061 target
        shell: bash -el {0}
        run: |
          set -euo pipefail
          curl -L --retry 4 --fail \
            -o comp1061_hybpiper_reference.fasta \
            https://raw.githubusercontent.com/carol-siniscalchi/Comp1061-Angio353/main/comp1061_hybpiper_reference.fasta
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("comp1061_hybpiper_reference.fasta")
          headers=[x[1:].strip() for x in p.read_text().splitlines() if x.startswith(">")]
          loci={h.split("-",1)[1] for h in headers}
          assert len(headers)==2597, len(headers)
          assert len(loci)==1061, len(loci)
          frozen=json.load(open("data/evidence/comp1061_public_target_audit_v1.json"))
          assert frozen["fasta_sequence_records"]==len(headers)
          assert frozen["distinct_loci"]==len(loci)
          print({"records":len(headers),"loci":len(loci)})
          PY

      - name: Download focal Cirsium sieboldii public run
        shell: bash -el {0}
        run: |
          set -euo pipefail
          prefetch --max-size 5G SRR30887308
          fasterq-dump --split-files --threads 4 --outdir . SRR30887308
          pigz -p 4 SRR30887308_1.fastq SRR30887308_2.fastq
          ls -lh SRR30887308_1.fastq.gz SRR30887308_2.fastq.gz

      - name: Run HybPiper with original Compositae1061 target
        shell: bash -el {0}
        run: |
          set -euo pipefail
          hybpiper assemble \
            -t_dna comp1061_hybpiper_reference.fasta \
            -r SRR30887308_1.fastq.gz SRR30887308_2.fastq.gz \
            --bwa \
            --prefix sieboldii_original \
            --cpu 4
          python analysis/summarize_r1b0_hybpiper_v1.py \
            --sample-dir sieboldii_original \
            --target comp1061_hybpiper_reference.fasta \
            --run SRR30887308 \
            --taxon "Cirsium sieboldii" \
            --target-version ORIGINAL_COMP1061 \
            --output r1b0_sieboldii_original_summary.json
          cat r1b0_sieboldii_original_summary.json

      - name: Upload focal preflight receipt
        uses: actions/upload-artifact@v4
        with:
          name: r1b0-sieboldii-original-${{ github.run_id }}
          path: |
            r1b0_sieboldii_original_summary.json
            sieboldii_original/*.log
            sieboldii_original/**/*paralog*
          if-no-files-found: warn
