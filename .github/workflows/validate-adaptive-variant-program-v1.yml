name: Validate adaptive-variant programme

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/AZA3_NATURE_SCALE_MASTER_PLAN_V1.md"
      - "docs/ADAPTIVE_VARIANT_IDENTIFICATION_PROGRAM_V1.md"
      - "data/planning/adaptive_variant_evidence_ladder_v1.csv"
      - "data/planning/adaptive_variant_focal_systems_v1.csv"
      - "analysis/validate_adaptive_variant_program_v1.py"
      - ".github/workflows/validate-adaptive-variant-program-v1.yml"
  workflow_dispatch:

concurrency:
  group: validate-adaptive-variant-program-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile analysis/validate_adaptive_variant_program_v1.py
          python analysis/validate_adaptive_variant_program_v1.py
