name: Validate aza3 Gate0A dated-tree readiness

on:
  pull_request:
    paths:
      - "docs/GATE0A_DATED_TREE_READINESS_AND_RECOVERY_V1.md"
      - "docs/GATE0A_ROUTE_A_RECHECK_20261004.md"
      - "data/contracts/aza3_gate0a_dated_tree_readiness_v1.json"
      - "data/contracts/aza3_gate0a_route_b_acceptance_v1.json"
      - "data/planning/aza3_gate0a_recovery_routes_v1.csv"
      - "docs/AZA3_NATURE_SCALE_MASTER_PLAN_V1.md"
      - "analysis/validate_gate0a_dated_tree_readiness_v1.py"
      - ".github/workflows/validate-gate0a-dated-tree-readiness-v1.yml"
  workflow_dispatch:

concurrency:
  group: validate-gate0a-dated-tree-readiness-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile analysis/validate_gate0a_dated_tree_readiness_v1.py
          python analysis/validate_gate0a_dated_tree_readiness_v1.py
