name: Build NMNS hole-fill snapshot v6

on:
  pull_request:
    paths:
      - ".github/workflows/build-nmns-hole-fill-snapshot-v6.yml"
      - "analysis/build_nmns_transition_candidate_universe_v3.py"
      - "analysis/build_backbone_hole_fill_snapshot_v6.py"
      - "data/planning/chapter3_core_operational_sample_ledger_v1.csv"
      - "data/planning/chapter3_moreyra_anchor_repair_v6.csv"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install snapshot dependencies
        run: python -m pip install --quiet pandas requests lxml beautifulsoup4
      - name: Capture current NMNS response and JS data source
        run: |
          mkdir -p snapshot/debug snapshot/nmns snapshot/holefill
          python - <<'PY'
          import json,requests
          from bs4 import BeautifulSoup
          headers={'User-Agent':'Mozilla/5.0 aza3-research-snapshot/1.0'}
          base='https://www.kahaku.go.jp/research/db/botany/azami/'
          url=base+'list.html?word=all'
          r=requests.get(url,timeout=60,headers=headers); r.raise_for_status()
          open('snapshot/debug/list_all_raw.html','wb').write(r.content)
          soup=BeautifulSoup(r.content,'html.parser')
          scripts=[x.get('src') for x in soup.find_all('script') if x.get('src')]
          js=requests.get(base+'data/data.js',timeout=60,headers=headers); js.raise_for_status()
          open('snapshot/debug/data.js','wb').write(js.content)
          az=requests.get(base+'js/azami.js',timeout=60,headers=headers); az.raise_for_status()
          open('snapshot/debug/azami.js','wb').write(az.content)
          info={'html_status':r.status_code,'html_length':len(r.content),'scripts':scripts,
                'data_js_status':js.status_code,'data_js_length':len(js.content),'data_js_content_type':js.headers.get('content-type'),
                'azami_js_length':len(az.content)}
          open('snapshot/debug/response_structure.json','w',encoding='utf-8').write(json.dumps(info,ensure_ascii=False,indent=2))
          print(json.dumps(info,ensure_ascii=False,indent=2))
          PY
      - name: Attempt legacy NMNS table parser and hole-fill screen
        continue-on-error: true
        run: |
          python analysis/build_nmns_transition_candidate_universe_v3.py \
            --moreyra-map data/planning/chapter3_core_operational_sample_ledger_v1.csv \
            --out-dir snapshot/nmns
          python analysis/build_backbone_hole_fill_snapshot_v6.py \
            --universe snapshot/nmns/nmns_transition_candidate_universe_v3.csv \
            --moreyra-ledger data/planning/chapter3_core_operational_sample_ledger_v1.csv \
            --repair-ledger data/planning/chapter3_moreyra_anchor_repair_v6.csv \
            --out-dir snapshot/holefill
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nmns-hole-fill-snapshot-v6
          path: snapshot/
          retention-days: 7
