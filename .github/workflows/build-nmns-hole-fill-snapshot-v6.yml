name: Build NMNS hole-fill snapshot v6

on:
  pull_request:
    paths:
      - ".github/workflows/build-nmns-hole-fill-snapshot-v6.yml"
      - "analysis/build_nmns_transition_candidate_universe_v3.py"
      - "analysis/build_backbone_hole_fill_snapshot_v6.py"
      - "data/planning/chapter3_core_operational_sample_ledger_v1.csv"
      - "data/planning/chapter3_moreyra_anchor_repair_v6.csv"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install snapshot dependencies
        run: python -m pip install --quiet pandas requests lxml
      - name: Fetch NMNS and build species-binomial hole-fill screen
        run: |
          mkdir -p snapshot/nmns snapshot/holefill
          python analysis/build_nmns_transition_candidate_universe_v3.py \
            --moreyra-map data/planning/chapter3_core_operational_sample_ledger_v1.csv \
            --out-dir snapshot/nmns
          python analysis/build_backbone_hole_fill_snapshot_v6.py \
            --universe snapshot/nmns/nmns_transition_candidate_universe_v3.csv \
            --moreyra-ledger data/planning/chapter3_core_operational_sample_ledger_v1.csv \
            --repair-ledger data/planning/chapter3_moreyra_anchor_repair_v6.csv \
            --out-dir snapshot/holefill
      - name: Print H1 candidates
        run: |
          python - <<'PY'
          import pandas as pd
          p='snapshot/holefill/nmns_moreyra_species_hole_fill_screen_v6.csv'
          d=pd.read_csv(p)
          print(d[d.slot_class.str.startswith('H1')][['species_binomial','japanese_names','n_nmns_records']].to_csv(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmns-hole-fill-snapshot-v6
          path: snapshot/
          retention-days: 7
