name: Build NMNS hole-fill snapshot v7

on:
  pull_request:
    paths:
      - ".github/workflows/build-nmns-hole-fill-snapshot-v6.yml"
      - "analysis/build_nmns_transition_candidate_universe_v3.py"
      - "analysis/build_nationwide_species_hole_fill_v7.py"
      - "data/planning/chapter3_moreyra_current_species_crosswalk_v7.csv"
      - "data/planning/chapter3_moreyra_anchor_repair_v6.csv"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install snapshot dependencies
        run: python -m pip install --quiet pandas requests
      - name: Build current NMNS universe from data.js
        run: |
          mkdir -p snapshot/nmns snapshot/holefill
          python analysis/build_nmns_transition_candidate_universe_v3.py \
            --out-dir snapshot/nmns
      - name: Build current species-level hole-fill ledgers
        run: |
          python analysis/build_nationwide_species_hole_fill_v7.py \
            --universe snapshot/nmns/nmns_transition_candidate_universe_v3.csv \
            --crosswalk data/planning/chapter3_moreyra_current_species_crosswalk_v7.csv \
            --repair-ledger data/planning/chapter3_moreyra_anchor_repair_v6.csv \
            --out-dir snapshot/holefill
      - name: Print summary and highest-priority empty blocks
        run: |
          cat snapshot/holefill/chapter3_nmns_hole_fill_summary_v7.json
          python - <<'PY'
          import pandas as pd
          p='snapshot/holefill/chapter3_nmns_block_gap_summary_v7.csv'
          d=pd.read_csv(p)
          print(d[d.block_priority.eq('B1_EMPTY_BLOCK')][['nmns_taxonomic_block','published_core_species','missing_species']].to_csv(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nmns-hole-fill-snapshot-v7
          path: snapshot/
          retention-days: 14
