name: Source-verified Cirsium visitation clock and SLK-ANTO biological gate
on:
  pull_request:
    paths:
      - "analysis/audit_arvense_original_visitor_clock_v1.py"
      - "tests/test_slk_anto_arvense_visitor_clock_v1.py"
      - "docs/SLK_ANTO_REAL_ARVENSE_VISITOR_CLOCK_V1.md"
      - ".github/workflows/real-arvense-visitor-clock-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic parsing, duplicate-key and causal-scope tests
        run: python -m unittest discover -s tests -p 'test_slk_anto_arvense_visitor_clock_v1.py' -v
      - name: Download two original public author CSV files at exact source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/cirsium_arvense_visitor_clock
          gh api 'repos/Yogita25/Multitrophic_Interactions/contents/Pollinators.csv?ref=8a151c62ed069f775a16b9bc5fbdce209cbb8691' --jq .content | base64 -d > work/cirsium_arvense_visitor_clock/Pollinators.csv
          gh api 'repos/Yogita25/Multitrophic_Interactions/contents/Pollinator_Id.csv?ref=8a151c62ed069f775a16b9bc5fbdce209cbb8691' --jq .content | base64 -d > work/cirsium_arvense_visitor_clock/Pollinator_Id.csv
          test -s work/cirsium_arvense_visitor_clock/Pollinators.csv
          test -s work/cirsium_arvense_visitor_clock/Pollinator_Id.csv
      - name: Recompute date and visit composition support, preserving source SHA
        run: |
          python analysis/audit_arvense_original_visitor_clock_v1.py \
            --bouts work/cirsium_arvense_visitor_clock/Pollinators.csv \
            --visitors work/cirsium_arvense_visitor_clock/Pollinator_Id.csv \
            --output work/cirsium_arvense_visitor_clock/result.json
      - name: Enforce no pseudolongitudinal Markov inference or invented genetics
        run: |
          python - <<'PY'
          import json,math
          d=json.load(open('work/cirsium_arvense_visitor_clock/result.json'))
          assert d['source_rows']['bouts']==120
          assert d['source_rows']['visitor_lines']==649
          assert d['source_rows']['distinct_calendar_dates']==10
          assert d['matched_taxonomic_observations']['named_order_visitor_lines']==548
          assert d['matched_taxonomic_observations']['named_order_bouts']==92
          assert d['matched_taxonomic_observations']['mixed_Hymenoptera_Diptera_bouts']==48
          assert d['first_last_comparisons']['site_count']==4
          assert d['first_last_comparisons']['positive_record_weighted_sites']==4
          assert d['first_last_comparisons']['positive_equal_bout_sites']==2
          assert all(v is False for v in d['scientific_boundaries'].values())
          assert d['source_rows']['survey_site_count']==4
          assert d['matched_taxonomic_observations']['ambiguous_bout_key_visitor_lines']==77
          assert d['matched_taxonomic_observations']['unmatched_bout_key_visitor_lines']==1
          assert d['source_rows']['repeated_site_block_treatment_across_dates']==18
          print('ORIGINAL_ARVENSE_VISITOR_CLOCK_VERIFIED',d['matched_taxonomic_observations']['mixed_Hymenoptera_Diptera_bouts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cirsium-arvense-original-visitor-clock-ecology-v1
          path: work/cirsium_arvense_visitor_clock/result.json
          if-no-files-found: error
          retention-days: 30
