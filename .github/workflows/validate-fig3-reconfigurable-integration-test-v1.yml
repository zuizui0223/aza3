name: Validate Fig3 reconfigurable-integration contract

on:
  pull_request:
    paths:
      - "docs/FIG3_RECONFIGURABLE_INTEGRATION_TEST_V1.md"
      - "docs/FIG3_PROSPECTIVE_POWER_RULE_V1.md"
      - "data/contracts/aza3_fig3_reconfigurable_integration_test_v1.json"
      - "data/contracts/aza3_fig3_prospective_power_v1.json"
      - "data/templates/fig3_preunblinding_prediction_registry_v1.csv"
      - "data/templates/fig3_validation_unlock_receipt_v1.json"
      - "data/templates/fig3_postunblinding_score_registry_v1.csv"
      - "analysis/score_fig3_heldout_prediction_v1.py"
      - "analysis/validate_fig3_reconfigurable_integration_test_v1.py"
      - "analysis/simulate_fig3_validation_power_v1.py"
      - ".github/workflows/validate-fig3-reconfigurable-integration-test-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate contracts and power simulator
        run: |
          python -m py_compile analysis/score_fig3_heldout_prediction_v1.py
          python -m py_compile analysis/validate_fig3_reconfigurable_integration_test_v1.py
          python -m py_compile analysis/simulate_fig3_validation_power_v1.py
          python analysis/validate_fig3_reconfigurable_integration_test_v1.py
          python analysis/simulate_fig3_validation_power_v1.py --reps 200 --sign-draws 199 --output-json power_smoke.json --output-csv power_smoke.csv

      - name: Build immutable-style synthetic registries
        run: |
          python - <<'PY'
          import csv, hashlib, json
          pred_fields="individual_id,validation_unit,split,prediction_registry_frozen_at,prediction_model_version,model_F_prediction_object,model_M_prediction_object,model_Mlocal_prediction_object,model_R_prediction_object,colour_genomic_state,orientation_genomic_state,prospective_mosaic_registered,reference_stable,taxonomic_confidence,technical_exclusion_reason,admitted_construct_count,admitted_multi_trait_module_count".split(",")
          score_fields="individual_id,validation_unit,prediction_registry_sha256,observed_phenotype_source,model_F_joint_log_score,model_M_joint_log_score,model_Mlocal_joint_log_score,model_R_joint_log_score,d_RM_i,d_MF_i,colour_R_minus_M_log_score,orientation_R_minus_M_log_score,prospective_mosaic_registered,colour_prediction_correct,orientation_prediction_correct,reference_stable,taxonomic_confidence,technical_exclusion_reason,module_colour_M_log_score,module_colour_R_log_score,module_head_form_M_log_score,module_head_form_R_log_score".split(",")

          def make(prefix,n,F,M,ML,R,constructs=5,modules=2,mosaics=0,module_mode="R"):
              preds=[]
              for i in range(n):
                  preds.append({
                    "individual_id":f"{prefix}{i+1:02d}","validation_unit":"POP2","split":"VALIDATION",
                    "prediction_registry_frozen_at":"2026-10-06T00:00:00Z","prediction_model_version":"FMR_v1",
                    "model_F_prediction_object":"Fobj","model_M_prediction_object":"Mobj","model_Mlocal_prediction_object":"MLobj","model_R_prediction_object":"Robj",
                    "colour_genomic_state":"C1","orientation_genomic_state":"O2",
                    "prospective_mosaic_registered":"true" if i<mosaics else "false",
                    "reference_stable":"true","taxonomic_confidence":"high","technical_exclusion_reason":"",
                    "admitted_construct_count":str(constructs),"admitted_multi_trait_module_count":str(modules)
                  })
              pred=f"{prefix}_pred.csv"
              with open(pred,"w",newline="") as fh:
                  w=csv.DictWriter(fh,fieldnames=pred_fields); w.writeheader(); w.writerows(preds)
              h=hashlib.sha256(open(pred,"rb").read()).hexdigest()
              receipt={"receipt_version":"aza3_fig3_validation_unlock_receipt_v1","status":"UNLOCKED_FOR_SCORING",
                       "prediction_registry_path":pred,"prediction_registry_sha256":h,
                       "prediction_registry_frozen_at":"2026-10-06T00:00:00Z",
                       "validation_phenotypes_opened_at":"2026-10-06T01:00:00Z","opened_by":"CI"}
              with open(f"{prefix}_unlock.json","w") as fh: json.dump(receipt,fh)
              scores=[]
              for i,p in enumerate(preds):
                  if module_mode=="R": cM,cR,hM,hR="-1.2","-0.8","-1.3","-0.9"
                  elif module_mode=="M": cM,cR,hM,hR="-0.8","-1.2","-0.9","-1.3"
                  else: cM=cR=hM=hR=""
                  scores.append({
                    "individual_id":p["individual_id"],"validation_unit":"POP2","prediction_registry_sha256":h,
                    "observed_phenotype_source":"synthetic","model_F_joint_log_score":str(F),
                    "model_M_joint_log_score":str(M),"model_Mlocal_joint_log_score":str(ML),"model_R_joint_log_score":str(R),
                    "d_RM_i":str(R-M),"d_MF_i":str(M-F),
                    "colour_R_minus_M_log_score":"","orientation_R_minus_M_log_score":"",
                    "prospective_mosaic_registered":p["prospective_mosaic_registered"],
                    "colour_prediction_correct":"true","orientation_prediction_correct":"true",
                    "reference_stable":"true","taxonomic_confidence":"high","technical_exclusion_reason":"",
                    "module_colour_M_log_score":cM,"module_colour_R_log_score":cR,
                    "module_head_form_M_log_score":hM,"module_head_form_R_log_score":hR
                  })
              with open(f"{prefix}_scores.csv","w",newline="") as fh:
                  w=csv.DictWriter(fh,fieldnames=score_fields); w.writeheader(); w.writerows(scores)

          make("R",20,-4,-3,-2.5,-2,mosaics=3,module_mode="R")
          make("M",20,-4,-2,-2,-3,module_mode="M")
          make("F",20,-2,-3,-3,-4,module_mode="M")
          make("SMALL",19,-4,-3,-2.5,-2,mosaics=3,module_mode="R")
          PY

      - name: Score R, M, F and insufficient-validation cases
        run: |
          for x in R M F SMALL; do
            python analysis/score_fig3_heldout_prediction_v1.py               --scores ${x}_scores.csv --prediction-registry ${x}_pred.csv               --unlock-receipt ${x}_unlock.json --output ${x}.json
          done
          python - <<'PY'
          import json
          assert json.load(open("R.json"))["decision"]=="FIG3_R_STRONG"
          assert json.load(open("M.json"))["decision"]=="FIG3_MODULE_INHERITANCE_SUPPORTIVE"
          assert json.load(open("F.json"))["decision"]=="FIG3_WHOLE_ORGAN_SUPPORTIVE"
          assert json.load(open("SMALL.json"))["decision"]=="NOT_IDENTIFIABLE"
          assert json.load(open("R.json"))["prospective_mosaic_correct_both_n"]==3
          PY

      - name: Tampered prediction registry must fail
        run: |
          cp R_pred.csv R_pred_tampered.csv
          echo '#tamper' >> R_pred_tampered.csv
          if python analysis/score_fig3_heldout_prediction_v1.py             --scores R_scores.csv --prediction-registry R_pred_tampered.csv             --unlock-receipt R_unlock.json --output tampered.json; then
            echo "tampered registry unexpectedly passed" >&2
            exit 1
          fi
