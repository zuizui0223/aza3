name: Validate Cirsium head insect-access event ontology

on:
  pull_request:
    paths:
      - "data/contracts/capitulum_guild_access_event_contract_v1.json"
      - "data/intake/capitulum_guild_access_event_ledger_v1.csv"
      - "analysis/validate_capitulum_guild_access_event_ledger_v1.py"
      - "data/contracts/capitulum_video_effort_denominator_v1.json"
      - "data/intake/capitulum_video_effort_denominator_v1.csv"
      - "analysis/validate_capitulum_video_effort_denominator_v1.py"
      - "analysis/summarize_capitulum_guild_route_overlap_v1.py"
      - ".github/workflows/validate-capitulum-guild-access-events-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source-lock official EAzami Aim2 sheet headings (not field observations)
        run: |
          set -euo pipefail
          mkdir -p work/head_events/source
          ref=c9870e91604ed1514344ddc8f765eae5237dbf27
          curl -fsSL --retry 2 "https://raw.githubusercontent.com/zuizui0223/EAzami/$ref/sampling/aim2_capitulum_field_ledger_v1.csv" -o work/head_events/source/field.csv
          curl -fsSL --retry 2 "https://raw.githubusercontent.com/zuizui0223/EAzami/$ref/sampling/aim2_capitulum_observation_bout_ledger_v1.csv" -o work/head_events/source/bout.csv
          curl -fsSL --retry 2 "https://raw.githubusercontent.com/zuizui0223/EAzami/$ref/sampling/aim2_plant_display_predation_ledger_v1.csv" -o work/head_events/source/plant.csv
          test "$(git hash-object work/head_events/source/field.csv)" = b31bae930989b26f433da1407a60583e07ea8db1
          test "$(git hash-object work/head_events/source/bout.csv)" = 9d36f5efe66ea2ea9d54c5298cc69fa261a76857
          test "$(git hash-object work/head_events/source/plant.csv)" = 84c80d762ee967836f94d2ad90ec734a99148688
      - name: Execute no-record schema check and synthetic ecological misuse tests
        run: |
          python -m py_compile analysis/validate_capitulum_guild_access_event_ledger_v1.py
          python -m py_compile analysis/validate_capitulum_video_effort_denominator_v1.py
          python -m py_compile analysis/summarize_capitulum_guild_route_overlap_v1.py
          python analysis/validate_capitulum_guild_access_event_ledger_v1.py \
            --contract data/contracts/capitulum_guild_access_event_contract_v1.json \
            --events data/intake/capitulum_guild_access_event_ledger_v1.csv \
            --bout-header work/head_events/source/bout.csv \
            --field-header work/head_events/source/field.csv \
            --plant-header work/head_events/source/plant.csv \
            --self-test | tee work/head_events/validation.json
          python - <<'PY'
          import json
          d=json.load(open("work/head_events/validation.json"))
          assert d["n_approach_episodes"]==0
          assert d["synthetic_tests"]["n_expected_failure_checks"]>=6
          assert d["direct_trait_impact_on_seed_fitness"]=="NOT_IDENTIFIED"
          assert d["requires_denominator_bout_effort_and_undetected_event_recall"]
          print("PASS: ready for real event observations; no fabricated ecological results")
          PY
      - name: Validate zero-inclusive approach denominator and stage-safe event joining
        run: |
          python analysis/validate_capitulum_video_effort_denominator_v1.py \
            --contract data/contracts/capitulum_video_effort_denominator_v1.json \
            --effort data/intake/capitulum_video_effort_denominator_v1.csv \
            --events data/intake/capitulum_guild_access_event_ledger_v1.csv \
            --self-test | tee work/head_events/effort_validation.json
          python - <<'PY'
          import json
          d=json.load(open("work/head_events/effort_validation.json"))
          assert d["status"]=="NOT_IDENTIFIABLE_NO_REAL_VIDEO_BOUTS"
          assert d["n_effort_bouts"]==d["n_events_total"]==0
          assert d["observed_raw_arrival_rate_per_minute"] is None
          assert d["synthetic_tests"]["negative_cases"]>=11
          print("PASS: verified zero != missing/bad camera, denominator not fabricated")
          PY
      - name: Check pre-entry guild overlap requires real continuous video and replicate heads
        run: |
          python analysis/summarize_capitulum_guild_route_overlap_v1.py \
            --contract data/contracts/capitulum_video_effort_denominator_v1.json \
            --effort data/intake/capitulum_video_effort_denominator_v1.csv \
            --events data/intake/capitulum_guild_access_event_ledger_v1.csv \
            --self-test --out work/head_events/route_overlap.json
          python - <<'PY'
          import json
          j=json.load(open("work/head_events/route_overlap.json"))
          assert j["conditional_route_overlap"] is None
          assert j["status"]=="NO_REAL_VIDEO_EVENTS_OR_EFFORT"
          assert j["synthetic_tests"]["n_synthetic_tests"]==3
          print("PASS: no spurious guild selectivity or route overlap from absent field data")
          PY
      - name: Retain source schema and validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capitulum-guild-access-ontology-check
          path: work/head_events/
          retention-days: 30
          if-no-files-found: warn
