name: R1B-0 focal public-data smoke

on:
  pull_request:
    paths:
      - ".github/workflows/run-r1b0-focal-public-smoke-v1.yml"
      - "analysis/summarize_r1b0_hybpiper_sample_v1.py"
      - "data/evidence/comp1061_public_target_audit_v1.json"
      - "data/planning/reference_public_preflight_runs_v1.csv"
  workflow_dispatch:

concurrency:
  group: r1b0-focal-public-smoke-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focal-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: aza3-r1b0
          create-args: >-
            -c conda-forge -c bioconda
            python=3.12
            hybpiper=2.3.4
            sra-tools
            fastp
          cache-environment: true

      - name: Record tool versions
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p receipts
          {
            echo "hybpiper_version=$(hybpiper --version 2>&1 | tail -n 1)"
            echo "fasterq_dump_version=$(fasterq-dump --version 2>&1 | head -n 1)"
            echo "fastp_version=$(fastp --version 2>&1 | head -n 1)"
          } | tee receipts/tool_versions.txt

      - name: Fetch and audit original Compositae1061 target
        shell: bash -el {0}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             https://raw.githubusercontent.com/carol-siniscalchi/Comp1061-Angio353/main/comp1061_hybpiper_reference.fasta             -o comp1061_hybpiper_reference.fasta
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("comp1061_hybpiper_reference.fasta")
          headers=[x[1:].strip() for x in p.read_text().splitlines() if x.startswith(">")]
          loci={h.split("-",1)[1] for h in headers}
          prefixes={h.split("-",1)[0] for h in headers}
          assert len(headers)==2597, len(headers)
          assert len(loci)==1061, len(loci)
          assert prefixes=={"lett","saff","sunf"}, prefixes
          json.dump({
            "status":"ok",
            "sequence_records":len(headers),
            "distinct_loci":len(loci),
            "prefixes":sorted(prefixes)
          },open("receipts/target_audit_runtime.json","w"),indent=2)
          PY

      - name: Run focal smoke panel against ORIGINAL_COMP1061
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p raw trimmed hybpiper receipts
          printf "run\ttaxon\nSRR30887308\tCirsium_sieboldii\nSRR25265660\tCirsium_nipponicum\nSRR30887271\tCirsium_japonicum\n" > smoke_panel.tsv

          while IFS=$'\t' read -r RUN TAXON; do
            [ "$RUN" = "run" ] && continue
            echo "=== $RUN $TAXON ==="

            fasterq-dump --split-files --threads 4 --outdir raw "$RUN"

            fastp               --in1 "raw/${RUN}_1.fastq"               --in2 "raw/${RUN}_2.fastq"               --out1 "trimmed/${RUN}_1.fastq.gz"               --out2 "trimmed/${RUN}_2.fastq.gz"               --detect_adapter_for_pe               --thread 4               --json "receipts/${RUN}_fastp.json"               --html "receipts/${RUN}_fastp.html"

            mkdir -p "hybpiper/${RUN}"
            (
              cd "hybpiper/${RUN}"
              hybpiper assemble                 -t_dna "../../comp1061_hybpiper_reference.fasta"                 -r "../../trimmed/${RUN}_1.fastq.gz" "../../trimmed/${RUN}_2.fastq.gz"                 --bwa                 --prefix "${RUN}"                 --cpu 4
            )

            python analysis/summarize_r1b0_hybpiper_sample_v1.py               --sample-dir "hybpiper/${RUN}/${RUN}"               --sample "${RUN}"               --target-id ORIGINAL_COMP1061               --output "receipts/${RUN}_ORIGINAL_COMP1061.json"

            rm -f "raw/${RUN}_1.fastq" "raw/${RUN}_2.fastq"
          done < smoke_panel.tsv

      - name: Build smoke comparison receipt
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path

          taxa={
            "SRR30887308":"Cirsium sieboldii",
            "SRR25265660":"Cirsium nipponicum",
            "SRR30887271":"Cirsium japonicum",
          }
          rows=[]
          for run,taxon in taxa.items():
              d=json.load(open(f"receipts/{run}_ORIGINAL_COMP1061.json"))
              rows.append({
                "run":run,
                "taxon":taxon,
                "target":"ORIGINAL_COMP1061",
                "genes_with_seqs_count":d["genes_with_seqs_count"],
                "fna_file_count":d["fna_file_count"],
                "gene_read_counts_nonzero_genes":d["gene_read_counts_nonzero_genes"],
                "gene_read_counts_total":d["gene_read_counts_total"],
                "paralog_related_file_count":d["paralog_related_file_count"],
              })
          with open("receipts/r1b0_focal_smoke_summary.tsv","w",newline="") as fh:
              w=csv.DictWriter(fh,fieldnames=rows[0].keys(),delimiter="\t")
              w.writeheader(); w.writerows(rows)
          focal=next(x for x in rows if x["run"]=="SRR30887308")
          refs=[x for x in rows if x["run"]!="SRR30887308"]
          med=sorted(x["genes_with_seqs_count"] for x in refs)[len(refs)//2]
          out={
            "status":"SMOKE_EXECUTED",
            "scope":"ORIGINAL_COMP1061 only; not R1B-0 transferability decision",
            "focal_run":"SRR30887308",
            "focal_genes_with_seqs":focal["genes_with_seqs_count"],
            "comparison_genes_with_seqs":[x["genes_with_seqs_count"] for x in refs],
            "comparison_reference_value":med,
            "boundary":"No GREEN/AMBER/RED classification authorized from this smoke."
          }
          json.dump(out,open("receipts/r1b0_focal_smoke_receipt.json","w"),indent=2)
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r1b0-focal-public-smoke-${{ github.run_id }}
          path: |
            receipts/
            smoke_panel.tsv
          if-no-files-found: error
          retention-days: 30
