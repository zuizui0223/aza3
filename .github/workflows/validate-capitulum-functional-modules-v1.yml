name: Validate capitulum module trade-offs and evidence boundaries

on:
  pull_request:
    paths:
      - "analysis/audit_capitulum_functional_module_coupling_v1.py"
      - "data/contracts/capitulum_functional_module_tradeoff_registry_v1.json"
      - "docs/CAPITULUM_MODULE_FUNCTION_TRADEOFF_SYNC_COMPENSATION_V1.md"
      - ".github/workflows/validate-capitulum-functional-modules-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-module-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source-coupling audit and registered ecological hypotheses
        run: |
          python -m py_compile analysis/audit_capitulum_functional_module_coupling_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/contracts/capitulum_functional_module_tradeoff_registry_v1.json")
          v=json.loads(p.read_text())
          assert len(v["modules"])==8
          assert len(v["pairs"])==9
          ids={m["id"] for m in v["modules"]}
          assert ids=={"O","H","A","P","S","T","R","D"}
          assert all(set(x["module_ids"]).issubset(ids) for x in v["pairs"])
          assert any(x["id"]=="SUBSTITUTE" for x in v["comparison_models"])
          assert any(x["id"]=="SYNC" for x in v["comparison_models"])
          assert any(x["id"]=="PARTITION" for x in v["comparison_models"])
          assert v["primary_experimental_contrast"]["not_authorized"] is True
          assert "no" in v["scientific_headline_boundary"].lower()
          assert any("Herrera" in x["study"] and x["doi"]=="10.1073/pnas.252362799"
                    for x in v["key_prior_art"])
          print("PASS: ecological modules, no unauthorized field action, known prior art")
          PY
      - name: Reconstruct frozen Azami 36-pair and EAzami trait-history comparisons
        run: |
          python analysis/audit_capitulum_functional_module_coupling_v1.py \
            --out outputs/capitulum_functional_module_audit_v1.json
          python - <<'PY'
          import json
          j=json.load(open("outputs/capitulum_functional_module_audit_v1.json"))
          assert j["azami_all_36_pairs"]["n_pairs"]==36
          assert j["azami_all_36_pairs"]["n_among_stronger_than_within"]==33
          r=j["azami_all_36_pairs"]["candidate_subset"]
          assert r["orientation_x_head_elongation"]["among_taxon_rv"] > .33
          assert r["orientation_x_projection"]["among_taxon_rv"] < .01
          assert r["floral_chroma_x_projection"]["among_taxon_rv"] > .33
          assert r["projection_strength_x_pattern"]["within_taxon_rv"] > .35
          assert j["authority_state_support"]["joint_orientation_phyllary_concepts"]==8
          h=j["history"]["trait_pairs_sensitive_to_branch_model"]
          assert h["orientation_x_stickiness"]["branch_length_aware_stratified_one_sided_p"] < .01
          assert h["orientation_x_stickiness"]["topology_only_median_rho"] < 0
          assert all(not v["robustly_positive_both_layers"] for v in h.values())
          assert h["phyllary_x_stickiness"]["topology_only_q05"] < 0
          assert j["claims"]["historical_adaptive_nonsynchrony"]=="NOT_IDENTIFIED"
          print("PASS: frozen observed coupling and opposed sensitivity do not imply adaptation")
          PY
      - name: Preserve bounded evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capitulum-functional-module-source-audit
          path: outputs/capitulum_functional_module_audit_v1.json
          if-no-files-found: warn
          retention-days: 30
