name: Validate Nature-scale origin handoff

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/AZAMI_EAZAMI_TO_AZA3_NATURE_ORIGIN_HANDOFF_V1.md"
      - "data/contracts/aza3_nature_origin_handoff_v1.json"
      - "analysis/validate_nature_origin_handoff_v1.py"
      - ".github/workflows/validate-nature-origin-handoff-v1.yml"
  workflow_dispatch:

concurrency:
  group: validate-nature-origin-handoff-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m py_compile analysis/validate_nature_origin_handoff_v1.py
          python analysis/validate_nature_origin_handoff_v1.py
