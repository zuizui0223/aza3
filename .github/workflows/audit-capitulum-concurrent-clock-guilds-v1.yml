name: Audit Cirsium exact concurrent guild windows v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "analysis/audit_capitulum_concurrent_clock_guilds_v1.py"
      - "analysis/validate_capitulum_video_effort_denominator_v1.py"
      - "data/intake/capitulum_clock_matched_effort_sidecar_v1.csv"
      - "data/intake/capitulum_video_effort_denominator_v1.csv"
      - "data/intake/capitulum_guild_access_event_ledger_v1.csv"
      - "docs/CAPITULUM_TEMPORAL_OLFACTORY_VS_STRUCTURAL_GATE_V1.md"
      - ".github/workflows/audit-capitulum-concurrent-clock-guilds-v1.yml"

permissions:
  contents: read

jobs:
  synchronized-video-semantic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and reject within-stage clock mixture counterexample
        run: |
          python -m py_compile analysis/audit_capitulum_concurrent_clock_guilds_v1.py
          python analysis/audit_capitulum_concurrent_clock_guilds_v1.py \
            --out work/capitulum_exact_concurrent_guilds_v1.json
      - name: Assert verified absence is not converted to ecological segregation
        run: |
          python - <<'PY'
          import json
          d=json.load(open("work/capitulum_exact_concurrent_guilds_v1.json"))
          t=d["synthetic_tests"]
          real=d["real_data"]
          assert t["status"]=="PASS_SYNTHETIC_EXACT_CONCURRENT_CLOCK_MATCHING"
          assert abs(t["naive_same_stage_overlap"]-.2)<1e-12
          assert abs(t["within_exact_bout_window_overlap"]-1)<1e-12
          assert t["real_observation_rows"]==0
          assert real["status"]=="NO_REAL_HEAD_VIDEO_OR_CLOCK_EFFORT"
          assert real["exact_concurrent_overlap"] is None
          assert real["claim_ceiling"]=="NOT_IDENTIFIABLE"
          print("PASS: time-of-day segregation is not an anatomical portal effect")
          PY
