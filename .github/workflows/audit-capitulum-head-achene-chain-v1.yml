name: Audit Cirsium head-to-achene evidence chain v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "analysis/audit_capitulum_evidence_chain_readiness_v1.py"
      - "analysis/validate_capitulum_true_armature_contact_v1.py"
      - "analysis/validate_capitulum_video_effort_denominator_v1.py"
      - "data/intake/capitulum_true_armature_contact_v1.csv"
      - "data/intake/capitulum_guild_access_event_ledger_v1.csv"
      - "data/intake/capitulum_contact_attempt_sequence_v1.csv"
      - "data/intake/capitulum_video_effort_denominator_v1.csv"
      - "docs/CAPITULUM_ATTACK_INCIDENCE_AND_CONDITIONAL_DAMAGE_V1.md"
      - ".github/workflows/audit-capitulum-head-achene-chain-v1.yml"

permissions:
  contents: read

jobs:
  original-head-to-final-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch immutable native EAzami head and bout schemas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work
          gh api 'repos/zuizui0223/EAzami/contents/sampling/aim2_capitulum_field_ledger_v1.csv?ref=c9870e91604ed1514344ddc8f765eae5237dbf27' --jq .content | base64 -d > work/EAzami_original_heads.csv
          gh api 'repos/zuizui0223/EAzami/contents/sampling/aim2_capitulum_observation_bout_ledger_v1.csv?ref=c9870e91604ed1514344ddc8f765eae5237dbf27' --jq .content | base64 -d > work/EAzami_original_bouts.csv
          test -s work/EAzami_original_heads.csv
          test -s work/EAzami_original_bouts.csv
      - name: Run native-head-to-true-contact-to-filled-achene readiness audit
        run: |
          python -m py_compile analysis/audit_capitulum_evidence_chain_readiness_v1.py
          python analysis/audit_capitulum_evidence_chain_readiness_v1.py \
            --native-heads work/EAzami_original_heads.csv \
            --native-bouts work/EAzami_original_bouts.csv \
            --out work/Cirsium_head_evidence_readiness_v1.json
      - name: Assert missing rows cannot masquerade as absence or fitness
        run: |
          python - <<'PY'
          import json
          entire=json.load(open("work/Cirsium_head_evidence_readiness_v1.json"))
          assert entire["synthetic_integrity_tests"]["status"]=="PASS_SYNTHETIC_SOURCE_HEAD_TO_ACHENE_INTEGRITY"
          assert entire["synthetic_integrity_tests"]["negative_controls"]==7
          assert entire["synthetic_integrity_tests"]["real_field_observations"]==0
          r=entire["analysis"]
          assert r["status"]=="NO_REAL_FIELD_COHORT"
          assert r["counts"]["original_EAzami_heads"]==0
          assert r["counts"]["original_EAzami_bouts"]==0
          assert r["counts"]["verified_continuous_video_bouts"]==0
          assert r["counts"]["independently_recorded_approach_episodes"]==0
          assert r["counts"]["true_anatomical_contact_annotations"]==0
          assert r["counts"]["heads_with_joint_verified_video_morphology_filled_achenes"]==0
          assert r["readiness"]["filled_achene_endpoint"]=="HOLD_NO_FILLED_ACHENE_COUNTS"
          assert r["video_denominator_status"]=="NOT_IDENTIFIABLE_NO_REAL_VIDEO_BOUTS"
          assert r["real_contact_denominator_status"]=="NO_REAL_TRUE_ARMATURE_CONTACT_ANNOTATIONS"
          print("PASS: all actual biological gates empty, no field-fitness inference possible")
          PY
