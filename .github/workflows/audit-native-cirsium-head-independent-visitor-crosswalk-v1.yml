name: Source authentic Cirsium head morphology x independent adult visitor coverage
on:
  pull_request:
    paths:
      - 'analysis/audit_native_cirsium_head_guild_linkability_v1.py'
      - 'tests/test_native_cirsium_head_guild_linkability_v1.py'
      - 'data/evidence/cirsium_native_head_visitor_source_linkability_v1.json'
      - 'docs/CIRSIUM_NATIVE_HEAD_TRAIT_BY_REAL_VISITOR_LINKABILITY_20261024.md'
      - '.github/workflows/audit-native-cirsium-head-independent-visitor-crosswalk-v1.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-63-source-phylogenetic-tips-vs-original-3243-adult-visitors:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tested source-pinned numerical prerequisites
        run: |
          python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0
      - name: Test real sampling-unit, known native trait source code, taxon mapping and strict rejection
        run: |
          python -m py_compile analysis/audit_native_cirsium_head_guild_linkability_v1.py
          python -m unittest discover -s tests -p 'test_native_cirsium_head_guild_linkability_v1.py' -v
      - name: Retrieve original publicly archived GloBI 104162 interaction source from authenticated GitHub artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p work/native_visit
          gh api 'repos/zuizui0223/aza3/actions/artifacts/11534639952/zip' > work/native_visit/genuine_globi_archive.zip
          echo 'ce0513fde35d9c1be42cef87da7a6f4b262e9b4fe237ba0b78e9bf31771b58a4  work/native_visit/genuine_globi_archive.zip' | sha256sum -c -
      - name: Retrieve original North American Cirsium morphology study author's exact immutable source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api 'repos/carol-siniscalchi/cirsium/contents/traits/traits.csv?ref=c925d4af86160064448f794a9715f70b917a2786' --jq .content | base64 -d > work/native_visit/original_traits.csv
          python - <<'PY'
          import hashlib
          data=open('work/native_visit/original_traits.csv','rb').read()
          actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert actual=='fa127f0587b676e6e004ea121424d26069586bcb',(actual,'NA_TRAITS_SOURCE_TAMPERED')
          print('ORIGINAL_CIRSIUM_63_AUTHOR_TRAIT_BLOB_VERIFIED',actual)
          PY
      - name: Recompute ORIGINAL actual adult visitor x head module crosswalk and identify true independent species contrast support
        run: |
          python analysis/audit_native_cirsium_head_guild_linkability_v1.py \
            --traits work/native_visit/original_traits.csv \
            --archive work/native_visit/genuine_globi_archive.zip \
            --out work/native_visit/actual_original_linkability.json
      - name: Fail closed on original cohort drift and fake pollination or antagonist fitness claims
        run: |
          python - <<'PY'
          import json
          p=json.load(open('work/native_visit/actual_original_linkability.json'))
          s=p['source_panel']
          assert p['source_admission']['raw_archive_rows']==104162
          assert s['n_original_phylogenetic_tip_labels']==63
          assert s['n_original_GloBI_eligible_events']==3243
          assert s['n_event_host_binomial_strings']==42
          assert s['n_nonbinomial_subspecies_or_multiword_tip_labels']>=1
          assert p['limits']['original_all_retained_gloBI_event_dates_missing']
          assert p['limits']['visitor_record_is_not_pollination_success_or_oviposition']
          assert p['limits']['no_new_organismal_field_data']==0
          assert len(p['species_all_original_native_binomial_tips'])==s['n_exact_unambiguous_binomial_labels']
          assert (s['n_events_joined_exact_binomial_NA_bounds']
                  <= s['n_events_joined_exact_binomial_anywhere'] <= 3243)
          frozen=json.load(open('data/evidence/cirsium_native_head_visitor_source_linkability_v1.json'))
          def check_numberwise(a,b,path='root'):
              import math
              if isinstance(b,dict):
                  assert isinstance(a,dict) and set(a)==set(b),(path,'keys',set(a)^set(b))
                  for k in b:check_numberwise(a[k],b[k],path+'.'+str(k))
              elif isinstance(b,list):
                  assert isinstance(a,list) and len(a)==len(b),(path,'length')
                  for i,(aa,bb) in enumerate(zip(a,b)):check_numberwise(aa,bb,path+f'[{i}]')
              elif type(b) is bool:
                  assert type(a) is bool and a==b,(path,a,b)
              elif type(b) in (int,float):
                  assert type(a) in (int,float) and math.isfinite(a),(path,a,b)
                  assert math.isclose(a,b,rel_tol=1e-12,abs_tol=1e-12),(path,a,b)
              else:
                  assert a==b,(path,a,b)
          check_numberwise(p,frozen)
          assert s['n_exact_unambiguous_binomial_labels']==56
          assert s['n_joined_taxa_in_NA_bounds']==15
          assert s['n_events_joined_exact_binomial_NA_bounds']==902
          assert p['primary_ten_records_per_species_2_regions']['n_species']==3
          assert p['primary_ten_records_per_species_2_regions']['trait_distribution']['source_head_pending']['status']=='NOT_IDENTIFIABLE_INDEPENDENT_MORPHOLOGY_GROUPS'
          print('PASS full 56 species x original 3243/902 visitors x exact current morph codes and all coarse region contrasts identical to frozen source receipt; no fabricated trait effect.')
          PY
      - name: Save only aggregate source coverage and no private precise visitor event coordinates
        uses: actions/upload-artifact@v4
        with:
          name: cirsium-original-na-head-3243-visit-coverage-v1
          path: work/native_visit/actual_original_linkability.json
          if-no-files-found: error
          retention-days: 90
