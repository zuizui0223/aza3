name: Q2 Cirsium stage-gated head benefit transport and joint-seed identifiability
on:
  pull_request:
    paths:
      - 'analysis/audit_cirsium_q2_stage_gate_transport_v1.py'
      - 'tests/test_cirsium_q2_stage_gate_transport_v1.py'
      - 'data/evidence/cirsium_q2_source_stage_transport_threshold_independent_JS_v1.json'
      - 'data/evidence/cirsium_vulgare_1988_original_multistage_source_tables_v1.json'
      - 'data/evidence/cirsium_arvense_four_arm_joint_response_independent_js_v1.json'
      - 'docs/CIRSIUM_Q2_STAGE_CONDITIONAL_HEAD_DEFENSE_FITNESS_GATE_20261026.md'
      - '.github/workflows/audit-cirsium-q2-stage-gated-head-benefit-transport-v1.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-source-marginals-and-missing-joint-state:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test genuine 1988 source, 2022 cross-species firewall, algebraic counterexamples and false trait claims
        run: |
          python -m py_compile analysis/audit_cirsium_q2_stage_gate_transport_v1.py
          python -m unittest discover -s tests -p 'test_cirsium_q2_stage_gate_transport_v1.py' -v
      - name: Recompute all ten original 1981-82 exclosure records and conditional trait-neutral and differential-route threshold calculations
        run: |
          mkdir -p work/q2_stage_gate
          python analysis/audit_cirsium_q2_stage_gate_transport_v1.py \
            --source-1988 data/evidence/cirsium_vulgare_1988_original_multistage_source_tables_v1.json \
            --separate-source-2022 data/evidence/cirsium_arvense_four_arm_joint_response_independent_js_v1.json \
            --out work/q2_stage_gate/original_source_Python.json
      - name: Crosscheck all source-cell/threshold values and constructively verify non-identifiability of missing H-by-q pairing
        run: |
          python - <<'PY'
          import json,math
          a=json.load(open('work/q2_stage_gate/original_source_Python.json'))
          b=json.load(open('data/evidence/cirsium_q2_source_stage_transport_threshold_independent_JS_v1.json'))
          def exact(x,y,path='root'):
              if isinstance(y,dict):
                  assert isinstance(x,dict) and set(x)==set(y),(path,set(x)^set(y))
                  for k,v in y.items():exact(x[k],v,path+'.'+k)
              elif isinstance(y,list):
                  assert isinstance(x,list) and len(x)==len(y),(path,len(x),len(y))
                  for i,(xx,yy) in enumerate(zip(x,y)):exact(xx,yy,path+f'[{i}]')
              elif type(y) is bool:
                  assert type(x) is bool and x==y,(path,x,y)
              elif type(y) in (int,float):
                  assert type(x) in (int,float) and math.isfinite(x),(path,x,y)
                  assert math.isclose(x,y,rel_tol=1e-12,abs_tol=1e-12),(path,x,y)
              else:
                  assert x==y,(path,x,y)
          exact(a,b)
          assert a['source']['source_doi']=='10.2307/2260602'
          assert a['source_aggregates']['within_habitat_date_cage_retention_exceeds_open']==10
          assert math.isclose(a['source_aggregates']['mean_seed_retention_percentage']['cage'],93.8,abs_tol=1e-12)
          assert math.isclose(a['source_aggregates']['mean_seed_retention_percentage']['open'],36.5,abs_tol=1e-12)
          assert a['definitions']['independent_cross_source_numeric_product_forbidden']
          scenario=a['counterfactual_algebra_only']['declared_illustrative_Hratios'][2]
          assert scenario['hypothetical_predispersal_head_seed_output_ratio_protected_over_open']==.8
          assert scenario['n_habitat_dates_where_protected_head_route_would_yield_more_surviving_exposed_seeds']==8
          assert not scenario['trait_changes_seed_caging_or_deposition_observed']
          witness=a['counterfactual_algebra_only']['joint_alignment_nonidentifiability_witness']
          assert witness['source_field_rows_used']==0
          assert witness['naive_marginal_product']==2.5
          assert math.isclose(witness['aligned_H_and_q_scenario']['mean_H_times_q'],3.7)
          assert math.isclose(witness['opposed_H_and_q_scenario']['mean_H_times_q'],1.3)
          assert a['measurement_gate']['status']=='SOURCE_RETENTION_QUANTIFIED_BUT_HEAD_MODULE_TRANSMISSION_NOT_IDENTIFIABLE'
          assert a['measurement_gate']['new_field_observations']==0
          print('PASS all 10 source 3-arm cage/net/open tables, fixed-q sign invariance, differential-route break-even, same-marginal different covariance witness, and no false lifetime Cirsium fitness.')
          PY
      - name: Retain numerical trace without imaginary individual seed data
        uses: actions/upload-artifact@v4
        with:
          name: aza3-real-Cirsium-stage-risk-threshold-20261026
          path: work/q2_stage_gate/original_source_Python.json
          retention-days: 30
          if-no-files-found: error
