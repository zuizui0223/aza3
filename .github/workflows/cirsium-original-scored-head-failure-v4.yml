name: Cirsium original mother-head scored lateral inventory and joint seed failure v4
on:
  pull_request:
    paths:
      - 'analysis/audit_cirsium_undulatum_scored_head_failure_v4.py'
      - 'analysis/audit_cirsium_undulatum_lateral_head_positions_v5.py'
      - 'analysis/audit_cirsium_undulatum_ambient_failure_size_v6.py'
      - 'tests/test_cirsium_undulatum_ambient_failure_size_v6.py'
      - 'data/evidence/cirsium_undulatum_2008_ambient_failure_size_independent_js_v6.json'
      - 'docs/CIRSIUM_UNDULATUM_AMBIENT_COMMON_FAILURE_SIZE_SENSITIVITY_20261028.md'
      - 'tests/test_cirsium_undulatum_lateral_head_positions_v5.py'
      - 'data/evidence/cirsium_undulatum_lateral_head_positions_independent_js_v5.json'
      - 'tests/test_cirsium_undulatum_scored_head_failure_v4.py'
      - 'data/evidence/cirsium_undulatum_scored_head_failure_independent_js_v4.json'
      - 'docs/CIRSIUM_UNDULATUM_SCORED_LATERAL_HEADS_DURING_JOINT_SEED_FAILURE_20261028.md'
      - '.github/workflows/cirsium-original-scored-head-failure-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-matched-heads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify raw USDA source counts, 2008 mother-head join, and negative controls
        run: |
          python -m py_compile analysis/audit_cirsium_undulatum_scored_head_failure_v4.py tests/test_cirsium_undulatum_scored_head_failure_v4.py
          python -m unittest discover -s tests -p 'test_cirsium_undulatum_scored_head_failure_v4.py' -v
          python -m unittest discover -s tests -p 'test_cirsium_undulatum_maternal_route_coverage_v3.py' -v
          python -m unittest discover -s tests -p 'test_cirsium_undulatum_maternal_reproductive_routes_v2.py' -v
      - name: Test recorded positional fallback and same-source original ID prefix strata
        run: |
          python -m unittest discover -s tests -p 'test_cirsium_undulatum_lateral_head_positions_v5.py' -v
          python analysis/audit_cirsium_undulatum_lateral_head_positions_v5.py --output /tmp/cirsium_source_positions_v5.json
          python - <<'PY'
          import json,math
          a=json.load(open('/tmp/cirsium_source_positions_v5.json'))
          b=json.load(open('data/evidence/cirsium_undulatum_lateral_head_positions_independent_js_v5.json'))
          def verify(x,y,path='root'):
              if isinstance(y,dict):
                  assert isinstance(x,dict) and set(x)==set(y),(path,'dict',set(x)^set(y))
                  for k in y:verify(x[k],y[k],path+'.'+k)
              elif isinstance(y,list):
                  assert isinstance(x,list) and len(x)==len(y),(path,'list')
                  for i,(u,v) in enumerate(zip(x,y)):verify(u,v,path+'['+str(i)+']')
              elif type(y) is bool:
                  assert type(x) is bool and x==y,(path,x,y)
              elif isinstance(y,(int,float)):
                  assert type(x) in (int,float) and math.isfinite(x)
                  assert math.isclose(x,y,rel_tol=1e-12,abs_tol=1e-10),(path,x,y)
              else:
                  assert x==y,(path,x,y)
          verify(a,b)
          assert a['source']['jointly_validated_2008_mothers']==67
          assert a['source']['mothers_with_2plus_scored_lateral_heads']==33
          assert a['by_2008_treatment']['dni']['first_zero_later_positive_mothers']==['ES68','SD05']
          assert [a['original_id_prefix_strata'][p]['original_arms']['dni']['both_seed_routes_zero'] for p in ('ES','SD','WG','WR')]==[0,2,2,1]
          assert not any(a['claim_limits'].values())
          print('PASS_ORIGINAL_2008_CIRSIUM_LATERAL_POSITION_REROUTING_NOT_HEAD_CHRONOLOGY_OR_EVOLUTIONARY_REGAIN')
          PY
      - name: Audit original ambient mothers' plant size and structural opportunity using 6 exact source permutations
        run: |
          python -m unittest discover -s tests -p 'test_cirsium_undulatum_ambient_failure_size_v6.py' -v
          python analysis/audit_cirsium_undulatum_ambient_failure_size_v6.py --output /tmp/cirsium_2008_ambient_size_v6.json
          python - <<'PY'
          import json,math
          a=json.load(open('/tmp/cirsium_2008_ambient_size_v6.json'))
          b=json.load(open('data/evidence/cirsium_undulatum_2008_ambient_failure_size_independent_js_v6.json'))
          def eq(x,y,p='root'):
              if isinstance(y,dict):
                  assert isinstance(x,dict) and set(x)==set(y),(p,'keys',set(x)^set(y))
                  for k in y:eq(x[k],y[k],p+'.'+k)
              elif isinstance(y,list):
                  assert isinstance(x,list) and len(x)==len(y),(p,'list')
                  for i,(u,v) in enumerate(zip(x,y)):eq(u,v,p+f'[{i}]')
              elif type(y) is bool:
                  assert type(x) is bool and x==y,(p,x,y)
              elif isinstance(y,(int,float)):
                  assert type(x) in (int,float) and math.isfinite(x) and math.isclose(x,y,abs_tol=1e-9,rel_tol=1e-11),(p,x,y)
              else:
                  assert x==y,(p,x,y)
          eq(a,b)
          z=a['six_exploratory_covariates']['plant_height_cm']
          assert z['exact_stratified_permutation']['total_assignments']==360360
          assert z['exact_stratified_permutation']['p_two_sided']<.05
          assert z['q_BH_six_exploratory_covariates']>.05
          assert a['height_sensitivity']['leave_out_source_prefix']['WR']['p_two_sided']>.25
          assert a['height_sensitivity']['leave_out_highest_successful_height']['p_two_sided']>.05
          assert a['source']['ambient_insect_2008_mothers']==27
          assert all(v is False for v in a['interpretive_ceiling'].values())
          print('PASS_USDA_2008_AMBIENT_FAILURE_EXACT_6_FEATURE_SCREEN_AND_EXPLICIT_NONCAUSAL_CEILING')
          PY
      - name: Reproduce exact 67-mother 178-head original 2008 source
        run: |
          python analysis/audit_cirsium_undulatum_scored_head_failure_v4.py --output /tmp/cirsium_usda_scored_heads_v4.json
      - name: Independent source-JavaScript whole-receipt agreement; no causal-genetic claims
        run: |
          python - <<'PY'
          import json,math
          a=json.load(open('/tmp/cirsium_usda_scored_heads_v4.json'))
          b=json.load(open('data/evidence/cirsium_undulatum_scored_head_failure_independent_js_v4.json'))
          def compare(x,y,path='root'):
              if isinstance(y,dict):
                  assert isinstance(x,dict) and set(x)==set(y),(path,'keys',set(x)^set(y))
                  for k in y:compare(x[k],y[k],path+'.'+k)
              elif isinstance(y,list):
                  assert isinstance(x,list) and len(x)==len(y),(path,'array shape')
                  for i,(xx,yy) in enumerate(zip(x,y)):compare(xx,yy,path+f'[{i}]')
              elif isinstance(y,bool):
                  assert type(x) is bool and x==y,(path,x,y)
              elif isinstance(y,(float,int)):
                  assert type(x) in (int,float) and math.isfinite(x)
                  assert math.isclose(x,y,abs_tol=1e-10,rel_tol=1e-12),(path,x,y)
              else:
                  assert x==y,(path,x,y)
          compare(a,b)
          assert a['source']['mother_head_reconciliation_all_2008'] is True
          assert a['source']['original_2008_head_rows']==178
          assert a['source']['original_2008_lateral_head_rows']==111
          assert a['year2008_by_original_treatment']['dni']['joint_failure_mothers_with_scored_lateral_head']==5
          assert a['year2008_by_original_treatment']['ndni']['joint_failure_mothers_with_scored_lateral_head']==9
          assert a['year2008_by_original_treatment']['dni']['lateral_positive_seed_heads_at_max_damage_088']==6
          assert a['within_mother_lateral_head_damage_comparison']['successful_lateral_heads_higher_damage_mothers']==5
          assert a['other_year_archive_quality']['full_2007_mother_head_joint_state_authenticated'] is False
          assert all(v is False for v in a['scientific_claim_limits'].values())
          print('PASS_ACTUAL_LATERAL_HEADS_IN_JOINT_SEED_FAILURE_NOT_GENETIC_AFTERLIFE_OR_CAUSAL_DAMAGERESISTANCE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-audited-cirsium-real-scored-head-failure-v4
          path: /tmp/cirsium_usda_scored_heads_v4.json
          retention-days: 30
