name: Validate Chapter 3 EAzami handoff

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/CHAPTER3_SCOPE_AND_HANDOFF_V1.md"
      - "docs/CHAPTER3_EXACT_BACKBONE_HOLE_FILL_LEDGER_V7.md"
      - "docs/CHAPTER3_RADSEQ_END_TO_END_V1.md"
      - "docs/M01_FLORAL_PIGMENTATION_MECHANISTIC_DEMONSTRATION_V1.md"
      - "data/contracts/chapter3_eazami_handoff_contract_v1.json"
      - "data/planning/chapter3_sampling_priorities_v1.csv"
      - "data/planning/chapter3_mechanistic_demonstration_v1.json"
      - "data/planning/chapter3_exact_hole_fill_summary_v7.json"
      - "data/planning/chapter3_holefill_priority1_empty_blocks_v7.csv"
      - "data/planning/chapter3_holefill_priority1_sample_sectors_v7.csv"
      - "data/planning/chapter3_holefill_priority2_broken_tips_v7.csv"
      - "data/planning/chapter3_holefill_priority3_kaganoazami_block_v7.csv"
      - "data/planning/chapter3_holefill_priority3_sawaazami_block_v7.csv"
      - "data/planning/chapter3_holefill_priority3_norikura_series_v7.csv"
      - "data/planning/chapter3_holefill_priority3_hamaazami_block_v7.csv"
      - "data/planning/chapter3_holefill_priority3_yamaazami_block_v7.csv"
      - "data/planning/chapter3_holefill_priority4_partial_blocks_v7.csv"
      - "data/planning/chapter3_holefill_priority5_local_gaps_v7.csv"
      - "data/planning/chapter3_holefill_priority6_add_own_trait_link_v7.csv"
      - "data/planning/chapter3_holefill_priority7_tree_filled_v7.csv"
      - "data/planning/chapter3_holefill_taxonomy_extension_v7.csv"
      - "data/planning/chapter3_holefill_taxonomy_conflicts_v7.csv"
      - "data/intake/chapter3_individual_intake_v1.csv"
      - "data/intake/chapter3_radseq_library_intake_v1.csv"
      - "analysis/validate_chapter3_handoff_v1.py"
      - "analysis/validate_mechanistic_demonstration_v1.py"
      - "analysis/validate_exact_hole_fill_v7.py"
      - "tests/test_validate_chapter3_handoff_v1.py"
      - "tests/test_validate_mechanistic_demonstration_v1.py"
      - "tests/test_validate_exact_hole_fill_v7.py"
      - ".github/workflows/validate-chapter3-handoff-v1.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate fail-closed Chapter 3 core handoff
        run: |
          python analysis/validate_chapter3_handoff_v1.py
          python tests/test_validate_chapter3_handoff_v1.py -v
      - name: Validate embedded M01 depth demonstration
        run: |
          python analysis/validate_mechanistic_demonstration_v1.py
          python tests/test_validate_mechanistic_demonstration_v1.py -v
      - name: Validate exact species-level backbone hole fill v7
        run: |
          python analysis/validate_exact_hole_fill_v7.py
          python tests/test_validate_exact_hole_fill_v7.py -v
