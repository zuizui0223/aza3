name: R1B0 focal public smoke

on:
  pull_request:
    paths:
      - ".github/workflows/r1b0-focal-public-smoke.yml"
      - "data/evidence/comp1061_public_target_audit_v1.json"
      - "data/planning/reference_public_preflight_runs_v1.csv"
      - "docs/R1B0_EXECUTION_RUNBOOK_V1.md"
  workflow_dispatch:

concurrency:
  group: r1b0-focal-public-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focal-original-target:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: r1b0
          create-args: >-
            python=3.12
            hybpiper=2.3.4
            sra-tools
            bwa
            samtools
          init-shell: bash
          cache-environment: true

      - name: Record software versions
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p r1b0_smoke
          {
            echo "hybpiper: $(hybpiper --version 2>&1 | head -1)"
            echo "prefetch: $(prefetch --version 2>&1 | head -1)"
            echo "fasterq-dump: $(fasterq-dump --version 2>&1 | head -1)"
            echo "bwa: $(bwa 2>&1 | head -1 || true)"
            echo "samtools: $(samtools --version | head -1)"
          } | tee r1b0_smoke/software_versions.txt

      - name: Fetch and audit original Compositae1061 target
        shell: bash -el {0}
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/carol-siniscalchi/Comp1061-Angio353/main/comp1061_hybpiper_reference.fasta \
            -o r1b0_smoke/comp1061_hybpiper_reference.fasta
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          p=Path("r1b0_smoke/comp1061_hybpiper_reference.fasta")
          b=p.read_bytes()
          text=b.decode()
          headers=re.findall(r"^>([^\r\n]+)", text, flags=re.M)
          loci=sorted({h.split("-",1)[1] for h in headers})
          prefixes=sorted({h.split("-",1)[0] for h in headers})
          report={
              "file_bytes": len(b),
              "sha256": hashlib.sha256(b).hexdigest(),
              "sequence_records": len(headers),
              "distinct_loci": len(loci),
              "prefixes": prefixes,
          }
          Path("r1b0_smoke/live_target_audit.json").write_text(json.dumps(report,indent=2)+"\n")
          frozen=json.loads(Path("data/evidence/comp1061_public_target_audit_v1.json").read_text())
          assert report["sequence_records"]==frozen["fasta_sequence_records"]==2597
          assert report["distinct_loci"]==frozen["distinct_loci"]==1061
          assert set(report["prefixes"])==set(frozen["reference_prefixes"])=={"lett","saff","sunf"}
          print(json.dumps(report,indent=2))
          PY

      - name: Download focal Cirsium sieboldii public run
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p r1b0_smoke/sra r1b0_smoke/reads r1b0_smoke/tmp
          cd r1b0_smoke/sra
          prefetch --max-size 2G SRR30887308
          cd ../..
          SRA_FILE="r1b0_smoke/sra/SRR30887308/SRR30887308.sra"
          test -s "$SRA_FILE"
          md5sum "$SRA_FILE" | tee r1b0_smoke/SRR30887308.sra.md5
          fasterq-dump "$SRA_FILE" \
            --split-files \
            --threads 4 \
            --temp r1b0_smoke/tmp \
            --outdir r1b0_smoke/reads
          test -s r1b0_smoke/reads/SRR30887308_1.fastq
          test -s r1b0_smoke/reads/SRR30887308_2.fastq

      - name: Audit focal read counts
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          out={}
          for mate in (1,2):
              p=Path(f"r1b0_smoke/reads/SRR30887308_{mate}.fastq")
              lines=0
              bases=0
              with p.open() as fh:
                  for i,line in enumerate(fh):
                      lines += 1
                      if i%4==1:
                          bases += len(line.strip())
              assert lines%4==0
              out[f"mate{mate}_reads"]=lines//4
              out[f"mate{mate}_bases"]=bases
          assert out["mate1_reads"]==out["mate2_reads"]
          out["read_pairs"]=out["mate1_reads"]
          out["total_bases"]=out["mate1_bases"]+out["mate2_bases"]
          Path("r1b0_smoke/read_audit.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY

      - name: Run HybPiper on focal run with original target
        shell: bash -el {0}
        run: |
          set -euo pipefail
          hybpiper assemble \
            -t_dna r1b0_smoke/comp1061_hybpiper_reference.fasta \
            -r r1b0_smoke/reads/SRR30887308_1.fastq r1b0_smoke/reads/SRR30887308_2.fastq \
            --bwa \
            --prefix SRR30887308__ORIGINAL_COMP1061 \
            --cpu 4 2>&1 | tee r1b0_smoke/hybpiper_assemble.log

      - name: Summarize recovered loci
        shell: bash -el {0}
        run: |
          set -euo pipefail
          PREFIX="SRR30887308__ORIGINAL_COMP1061"
          test -s "$PREFIX/genes_with_seqs.txt"
          cp "$PREFIX/genes_with_seqs.txt" r1b0_smoke/genes_with_seqs.txt
          printf '%s\n' "$PREFIX" > r1b0_smoke/namelist.txt
          hybpiper stats \
            -t_dna r1b0_smoke/comp1061_hybpiper_reference.fasta \
            gene r1b0_smoke/namelist.txt 2>&1 | tee r1b0_smoke/hybpiper_stats.log
          cp hybpiper_stats.tsv r1b0_smoke/ 2>/dev/null || true
          cp seq_lengths.tsv r1b0_smoke/ 2>/dev/null || true
          python - <<'PY'
          import json
          from pathlib import Path
          genes=[x.strip() for x in Path("r1b0_smoke/genes_with_seqs.txt").read_text().splitlines() if x.strip()]
          fna=list(Path("SRR30887308__ORIGINAL_COMP1061").rglob("*.FNA"))
          report={
              "run":"SRR30887308",
              "taxon":"Cirsium sieboldii",
              "target_version":"ORIGINAL_COMP1061",
              "target_loci":1061,
              "genes_with_sequences":len(set(genes)),
              "recovery_fraction":len(set(genes))/1061,
              "fna_files":len(fna),
              "decision_status":"SMOKE_ONLY__NO_TRANSFER_CLASSIFICATION",
          }
          Path("r1b0_smoke/focal_original_target_summary.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
          cat r1b0_smoke/focal_original_target_summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1b0-focal-original-target-${{ github.run_id }}
          path: |
            r1b0_smoke/
          retention-days: 30
