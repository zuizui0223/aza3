name: Validate delayed thistle enemy feedback v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "analysis/check_capitulum_delayed_enemy_feedback_v1.py"
      - "docs/CAPITULUM_LATE_PARASITOID_GENERATIONAL_FEEDBACK_V1.md"
      - ".github/workflows/validate-capitulum-delayed-enemy-feedback-v1.yml"

permissions:
  contents: read

jobs:
  synthetic-late-kill-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute both positive and negative feedback controls
        run: |
          python -m py_compile analysis/check_capitulum_delayed_enemy_feedback_v1.py
          python analysis/check_capitulum_delayed_enemy_feedback_v1.py --out work/capitulum_delayed_feedback_v1.json
      - name: Assert positive first season versus negative long-run is synthetic only
        run: |
          python - <<'PY'
          import json
          r=json.load(open("work/capitulum_delayed_feedback_v1.json"))
          a=r["illustrative_only"]
          assert r["test_result"]["status"]=="PASS_SYNTHETIC_DELAYED_ENEMY_FEEDBACK_TESTS"
          assert r["test_result"]["empirical_observations"]==0
          assert a["stable_equilibrium_damage_reversal"]
          assert a["first_cross_over_generation_within_simulation"]==2
          assert a["first_generation_relative_damage"]<1
          assert a["stable_equilibrium_relative_damage"]>1
          assert a["biological_data"]=="NONE"
          print("PASS: generational delay bounds; no field result inferred")
          PY
