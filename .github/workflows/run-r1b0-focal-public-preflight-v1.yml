name: Run R1B-0 focal public preflight

on:
  pull_request:
    paths:
      - "analysis/summarize_hybpiper_recovery_v1.py"
      - "data/evidence/moreyra_conservative_241_no_warning_loci_v1.txt"
      - "data/contracts/aza3_eazami_moreyra_locus_handoff_v1.json"
      - ".github/workflows/run-r1b0-focal-public-preflight-v1.yml"
  workflow_dispatch:

concurrency:
  group: run-r1b0-focal-public-preflight-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focal-original-target:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded HybPiper dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            sra-toolkit bwa samtools spades ncbi-blast+ exonerate parallel mafft
          python -m pip install --upgrade pip
          python -m pip install "hybpiper==2.3.4"

      - name: Freeze software versions
        run: |
          set -euo pipefail
          hybpiper --version
          fasterq-dump --version
          bwa 2>&1 | head -n 3 || true
          samtools --version | head -n 2
          spades.py --version

      - name: Fetch and audit original Compositae1061 target
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/carol-siniscalchi/Comp1061-Angio353/main/comp1061_hybpiper_reference.fasta \
            -o comp1061_hybpiper_reference.fasta
          python - <<'PY'
          from pathlib import Path
          p=Path("comp1061_hybpiper_reference.fasta")
          headers=[x[1:] for x in p.read_text().splitlines() if x.startswith(">")]
          loci={h.split("-",1)[1] for h in headers}
          assert len(headers)==2597, len(headers)
          assert len(loci)==1061, len(loci)
          print({"records":len(headers),"loci":len(loci),"bytes":p.stat().st_size})
          PY

      - name: Download focal Cirsium sieboldii public run
        run: |
          set -euo pipefail
          mkdir -p sra reads
          prefetch --max-size 2G --output-directory sra SRR30887308
          fasterq-dump sra/SRR30887308/SRR30887308.sra \
            --split-files --threads 4 --outdir reads
          wc -l reads/SRR30887308_1.fastq reads/SRR30887308_2.fastq
          du -h reads/SRR30887308_*.fastq

      - name: Run HybPiper against PUBLIC_COMP1061_1061
        run: |
          set -euo pipefail
          hybpiper assemble \
            -t_dna comp1061_hybpiper_reference.fasta \
            -r reads/SRR30887308_1.fastq reads/SRR30887308_2.fastq \
            --bwa \
            --prefix SRR30887308__PUBLIC_COMP1061_1061 \
            --cpu 4

      - name: Summarize focal target recovery
        run: |
          set -euo pipefail
          python analysis/summarize_hybpiper_recovery_v1.py \
            --root SRR30887308__PUBLIC_COMP1061_1061 \
            --expected-loci 1061 \
            --frozen-loci data/evidence/moreyra_conservative_241_no_warning_loci_v1.txt \
            --frozen-loci-id MOREYRA_COMPATIBILITY_241 \
            --output r1b0_focal_public1061_recovery_v1.json
          echo "===== PRIMARY R1B-0 FOCAL EMPIRICAL RESULT ====="
          cat r1b0_focal_public1061_recovery_v1.json | python -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d[k] for k in ["expected_public_named_loci","historical_author_target_count_reported","recovered_distinct_fna_loci","public_1061_recovery_fraction","frozen_loci_count","frozen_loci_recovered","frozen_loci_recovery_fraction","total_recovered_bp","median_recovered_bp","paralog_named_files","paralog_nonempty_line_total"]},indent=2))'
          echo "===== HYBPIPER TOP LEVEL ====="
          find SRR30887308__PUBLIC_COMP1061_1061 -maxdepth 2 -type f | sort | head -n 100

      - uses: actions/upload-artifact@v4
        with:
          name: r1b0-focal-public1061-241-${{ github.run_id }}
          path: |
            r1b0_focal_public1061_recovery_v1.json
            SRR30887308__PUBLIC_COMP1061_1061/*.txt
            SRR30887308__PUBLIC_COMP1061_1061/*.tsv
            SRR30887308__PUBLIC_COMP1061_1061/*.log
            SRR30887308__PUBLIC_COMP1061_1061/**/sequences/FNA/*.FNA
            SRR30887308__PUBLIC_COMP1061_1061/**/*genes_with_seqs*.txt
            SRR30887308__PUBLIC_COMP1061_1061/**/*paralog*
          if-no-files-found: warn
